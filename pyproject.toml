[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "document-converter"
dynamic = ["version"]
description = "Convert documents, spreadsheets, presentations and eBooks between 35+ formats, offline."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6-Essentials>=6.6",
    "pypandoc-binary>=1.13",
    "typst>=0.12",
    "pypdf>=4.0",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "xlrd>=2.0",
    "odfpy>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "python-docx>=1.1", "pyinstaller>=6.6", "pillow>=10"]

[project.gui-scripts]
document-converter = "document_converter.gui:main"

[project.scripts]
docconv = "document_converter.cli:main"

[project.urls]
Homepage = "https://github.com/joemunene-by/Document-Converter"

[tool.setuptools.dynamic]
version = { attr = "document_converter.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_converter = ["assets/*.png", "filters/*.lua"]

[tool.pytest.ini_options]
testpaths = ["tests"]
